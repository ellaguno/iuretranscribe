name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Un push nuevo cancela la corrida anterior de la misma rama (las etiquetas nunca se cancelan).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CUDA_VERSION: "12.8.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            features: ""
            args: ""
          - name: linux-x64-cuda
            os: ubuntu-22.04
            features: "cuda"
            # Sólo .deb: linuxdeploy no puede resolver las librerías de CUDA y el .rpm
            # duplicaría los ~600 MB del runtime.
            args: "--bundles deb --config src-tauri/tauri.cuda-linux.conf.json"
          - name: linux-x64-vulkan
            os: ubuntu-22.04
            features: "vulkan"
            args: "--config src-tauri/tauri.vulkan-linux.conf.json"
          - name: windows-x64
            os: windows-latest
            features: ""
            args: ""
          - name: windows-x64-cuda
            os: windows-2022
            features: "cuda"
            # Sólo NSIS: el .msi duplicaría los ~500 MB del runtime de CUDA.
            args: "--bundles nsis --config src-tauri/tauri.cuda-windows.conf.json"
          - name: windows-x64-vulkan
            os: windows-latest
            features: "vulkan"
            args: "--bundles nsis"
          - name: macos-arm64
            os: macos-latest
            features: "metal"
            args: "--target aarch64-apple-darwin"
          - name: macos-x64
            os: macos-15-intel
            features: ""
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # v2: invalida las cachés compiladas con -march=native (ver GGML_NATIVE abajo).
          key: ${{ matrix.name }}-v2

      - name: Dependencias de Linux (Tauri)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential cmake libclang-dev libssl-dev libdbus-1-dev

      # --- Vulkan (AMD / Intel / NVIDIA sin CUDA): sólo hace falta el SDK para compilar los shaders.
      - name: Vulkan SDK (Linux)
        if: matrix.features == 'vulkan' && startsWith(matrix.os, 'ubuntu')
        # Ubuntu 22.04 no trae glslc: se usa el repositorio de LunarG.
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          glslc --version
      - name: Vulkan SDK (Windows)
        if: matrix.features == 'vulkan' && startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile vulkan-sdk.exe
          Start-Process -Wait -FilePath .\vulkan-sdk.exe -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install"
          $sdk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "Vulkan SDK en $sdk"

      # --- CUDA (Linux): sólo los paquetes necesarios del repositorio de NVIDIA.
      - name: CUDA toolkit (Linux)
        if: matrix.features == 'cuda' && startsWith(matrix.os, 'ubuntu')
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart-dev", "driver-dev"]'
          non-cuda-sub-packages: '["libcublas-dev"]'
          use-github-cache: false

      # Copia el runtime de CUDA para incluirlo en el .deb/.rpm (/usr/lib/IureTranscribe)
      # y hace que el binario lo busque ahí primero.
      - name: Runtime de CUDA como recurso (Linux)
        if: matrix.features == 'cuda' && startsWith(matrix.os, 'ubuntu')
        run: |
          mkdir -p src-tauri/cuda-libs
          cp -L /usr/local/cuda/lib64/libcudart.so.12 /usr/local/cuda/lib64/libcublas.so.12 /usr/local/cuda/lib64/libcublasLt.so.12 src-tauri/cuda-libs/
          ls -la src-tauri/cuda-libs
          echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,$ORIGIN/../lib/IureTranscribe:/usr/local/cuda/lib64' >> "$GITHUB_ENV"

      # --- CUDA (Windows): nvcc + cuBLAS; se compila con Ninja + MSVC para no
      # depender de la integración de CUDA con Visual Studio.
      - name: CUDA toolkit (Windows)
        if: matrix.features == 'cuda' && startsWith(matrix.os, 'windows')
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'
          use-github-cache: false
      - name: Runtime de CUDA como recurso (Windows)
        if: matrix.features == 'cuda' && startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          mkdir -p src-tauri/cuda-libs
          cp "$CUDA_PATH"/bin/cudart64_12.dll "$CUDA_PATH"/bin/cublas64_12.dll "$CUDA_PATH"/bin/cublasLt64_12.dll src-tauri/cuda-libs/
          ls -la src-tauri/cuda-libs
      # CUDA y Vulkan en Windows: Ninja + MSVC (el generador de Visual Studio falla
      # con la integración de CUDA y con el generador de shaders de Vulkan).
      - name: Entorno MSVC
        if: (matrix.features == 'cuda' || matrix.features == 'vulkan') && startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
      - name: Usar Ninja para whisper.cpp (Windows + GPU)
        if: (matrix.features == 'cuda' || matrix.features == 'vulkan') && startsWith(matrix.os, 'windows')
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      # El generador de shaders de Vulkan anida un proyecto CMake muy profundo y MSVC
      # falla con rutas largas (C1041): se compila en un directorio corto.
      - name: Directorio de compilación corto (Windows + Vulkan)
        if: matrix.features == 'vulkan' && startsWith(matrix.os, 'windows')
        shell: bash
        run: echo "CARGO_TARGET_DIR=D:/t" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Modelo Base incluido en el instalador
        shell: bash
        run: |
          mkdir -p src-tauri/resources/models
          curl -sSL --retry 3 -o src-tauri/resources/models/ggml-base.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          ls -la src-tauri/resources/models

      # Identificación de hablantes: ejecutable aparte (sidecar) porque onnxruntime
      # estático y whisper.cpp no conviven en el mismo binario. Tauri lo busca como
      # binaries/iuretranscribe-diarize-<triple> y lo instala junto a la app.
      - name: Sidecar de identificación de hablantes
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          cargo build --release --manifest-path src-tauri/diarizer/Cargo.toml --target-dir src-tauri/diarizer/target
          mkdir -p src-tauri/binaries
          cp "src-tauri/diarizer/target/release/iuretranscribe-diarize$EXE" "src-tauri/binaries/iuretranscribe-diarize-$TRIPLE$EXE"
          ls -la src-tauri/binaries

      - name: Compilar y empaquetar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de los artefactos del actualizador (.sig). Sin estos secretos se
          # compila igual, pero la app sólo podrá avisar de versiones nuevas.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Sin optimizar para la CPU del runner: ggml compila por defecto con
          # -march=native (o su equivalente en MSVC), y los runners de GitHub tienen
          # AVX-512, así que el binario moría con «instrucción ilegal» al cargar el
          # modelo en cualquier CPU sin AVX-512: laptops, miniPCs y máquinas virtuales.
          # Con OFF, ggml usa AVX2/FMA/F16C, que tiene todo x86 desde 2013. En Apple
          # Silicon el runner y los usuarios comparten arquitectura y se deja nativo.
          GGML_NATIVE: ${{ matrix.name == 'macos-arm64' && 'ON' || 'OFF' }}
        with:
          projectPath: .
          args: ${{ matrix.args }} ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}

      # --- Firma Authenticode (Windows) con SignPath -------------------------------
      # Solo en releases (etiqueta) y solo cuando existen el token (secreto
      # SIGNPATH_API_TOKEN) y los identificadores del proyecto (variables
      # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG y SIGNPATH_SIGNING_POLICY_SLUG).
      # Sin ellos se publica sin firmar, como hasta ahora. SignPath recibe el
      # instalador de esta variante como artefacto, lo firma con el certificado de
      # SignPath Foundation tras la aprobación manual y lo devuelve; la firma
      # Authenticode cambia los bytes, así que la .sig del actualizador se rehace.
      - name: Instaladores de Windows por firmar
        id: sin_firmar
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          mkdir -p sin-firmar
          find "${CARGO_TARGET_DIR:-src-tauri/target}" -path '*/release/bundle/*' -type f \( -name '*-setup.exe' -o -name '*.msi' \) -exec cp {} sin-firmar/ \;
          ls -la sin-firmar
          echo "hay=$(ls sin-firmar | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Subir los instaladores como artefacto para SignPath
        id: artefacto_sin_firmar
        if: steps.sin_firmar.outputs.hay != '' && steps.sin_firmar.outputs.hay != '0'
        uses: actions/upload-artifact@v4
        with:
          name: sin-firmar-${{ matrix.name }}
          path: sin-firmar/*
          retention-days: 3

      - name: Firmar con SignPath
        id: signpath
        if: steps.artefacto_sin_firmar.outputs.artifact-id != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.artefacto_sin_firmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: firmados

      - name: Sustituir por los firmados y rehacer la firma del actualizador
        if: steps.signpath.outcome == 'success'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          base="${CARGO_TARGET_DIR:-src-tauri/target}"
          n=0
          for firmado in $(find firmados -type f \( -name '*.exe' -o -name '*.msi' \)); do
            nombre="$(basename "$firmado")"
            destino="$(find "$base" -path '*/release/bundle/*' -type f -name "$nombre" | head -1)"
            if [ -z "$destino" ]; then
              echo "::error::SignPath devolvió $nombre pero no existe en el bundle"
              exit 1
            fi
            cp "$firmado" "$destino"
            if [ -f "$destino.sig" ]; then
              npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$destino"
            fi
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo "::error::SignPath no devolvió ningún instalador"
            exit 1
          fi
          echo "$n instaladores firmados"

      # Renombra los instaladores con la variante para que no choquen entre sí en la
      # release. GitHub lista los assets por nombre (orden ASCII), así que el prefijo
      # numérico deja primero Windows, luego macOS y al final Linux.
      - name: Renombrar instaladores
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "${{ matrix.name }}" in
            windows-*) ORDEN=1 ;;
            macos-*)   ORDEN=2 ;;
            *)         ORDEN=3 ;;
          esac
          mkdir -p dist-release
          # bash 3.2 de macOS no tiene globstar: se usa find.
          find "${CARGO_TARGET_DIR:-src-tauri/target}" -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \
               -o -name '*.AppImage.sig' -o -name '*-setup.exe.sig' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) \
            -print | while read -r f; do
            base="$(basename "$f")"
            case "$base" in
              *.app.tar.gz.sig) ext="app.tar.gz.sig" ;;
              *.app.tar.gz)     ext="app.tar.gz" ;;
              *.AppImage.sig)   ext="AppImage.sig" ;;
              *-setup.exe.sig)  ext="exe.sig" ;;
              *)                ext="${base##*.}" ;;
            esac
            cp "$f" "dist-release/IureTranscribe_${VERSION}_${ORDEN}-${{ matrix.name }}.${ext}"
          done
          ls -la dist-release

      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "IureTranscribe $TAG" --notes-file .github/release-notes.md || true
          gh release upload "$TAG" dist-release/* --clobber

      - name: Publicar artefactos de compilación
        uses: actions/upload-artifact@v4
        with:
          name: iuretranscribe-${{ matrix.name }}
          if-no-files-found: ignore
          path: dist-release/*

  # Manifiesto del actualizador: una entrada por plataforma y variante, con las
  # firmas generadas por cada trabajo. Las instalaciones .deb/.rpm no se
  # actualizan solas (la app avisa y enlaza la release).
  manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generar latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, glob, datetime, re
          tag = os.environ["GITHUB_REF_NAME"]; version = tag.lstrip("v")
          base = f"https://github.com/ellaguno/iuretranscribe/releases/download/{tag}/"
          # nombre de variante en los archivos → clave del actualizador (os-arch[-variante])
          targets = {
            "linux-x64": "linux-x86_64", "linux-x64-vulkan": "linux-x86_64-vulkan", "linux-x64-cuda": "linux-x86_64-cuda",
            "windows-x64": "windows-x86_64", "windows-x64-vulkan": "windows-x86_64-vulkan", "windows-x64-cuda": "windows-x86_64-cuda",
            "macos-arm64": "darwin-aarch64", "macos-x64": "darwin-x86_64",
          }
          platforms = {}
          for sig in glob.glob("artifacts/**/*.sig", recursive=True):
              name = os.path.basename(sig)
              asset = name[:-4]  # sin .sig
              variant = None
              for v in targets:
                  # IureTranscribe_<versión>_<orden>-<variante>.<ext>
                  if re.match(rf"IureTranscribe_{re.escape(version)}_\d-{re.escape(v)}\.", asset):
                      variant = v
              if not variant:
                  continue
              platforms[targets[variant]] = {"url": base + asset, "signature": open(sig).read().strip()}
          manifest = {"version": version, "notes": f"IureTranscribe {version}", "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "platforms": platforms}
          json.dump(manifest, open("latest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
