name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Un push nuevo cancela la corrida anterior de la misma rama (las etiquetas nunca se cancelan).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CUDA_VERSION: "12.8.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            features: ""
            args: ""
          - name: linux-x64-cuda
            os: ubuntu-22.04
            features: "cuda"
            # Sólo .deb: linuxdeploy no puede resolver las librerías de CUDA y el .rpm
            # duplicaría los ~600 MB del runtime.
            args: "--bundles deb --config src-tauri/tauri.cuda-linux.conf.json"
          - name: linux-x64-vulkan
            os: ubuntu-22.04
            features: "vulkan"
            args: "--config src-tauri/tauri.vulkan-linux.conf.json"
          - name: windows-x64
            os: windows-latest
            features: ""
            args: ""
          - name: windows-x64-cuda
            os: windows-2022
            features: "cuda"
            # Sólo NSIS: el .msi duplicaría los ~500 MB del runtime de CUDA.
            args: "--bundles nsis --config src-tauri/tauri.cuda-windows.conf.json"
          - name: windows-x64-vulkan
            os: windows-latest
            features: "vulkan"
            args: "--bundles nsis"
          - name: macos-arm64
            os: macos-latest
            features: "metal"
            args: "--target aarch64-apple-darwin"
          - name: macos-x64
            os: macos-15-intel
            features: ""
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # v2: invalida las cachés compiladas con -march=native (ver GGML_NATIVE abajo).
          key: ${{ matrix.name }}-v2

      - name: Dependencias de Linux (Tauri)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential cmake libclang-dev libssl-dev libdbus-1-dev

      # --- Vulkan (AMD / Intel / NVIDIA sin CUDA): sólo hace falta el SDK para compilar los shaders.
      - name: Vulkan SDK (Linux)
        if: matrix.features == 'vulkan' && startsWith(matrix.os, 'ubuntu')
        # Ubuntu 22.04 no trae glslc: se usa el repositorio de LunarG.
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          glslc --version
      - name: Vulkan SDK (Windows)
        if: matrix.features == 'vulkan' && startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile vulkan-sdk.exe
          Start-Process -Wait -FilePath .\vulkan-sdk.exe -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install"
          $sdk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "Vulkan SDK en $sdk"

      # --- CUDA (Linux): sólo los paquetes necesarios del repositorio de NVIDIA.
      - name: CUDA toolkit (Linux)
        if: matrix.features == 'cuda' && startsWith(matrix.os, 'ubuntu')
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart-dev", "driver-dev"]'
          non-cuda-sub-packages: '["libcublas-dev"]'
          use-github-cache: false

      # Copia el runtime de CUDA para incluirlo en el .deb/.rpm (/usr/lib/IureTranscribe)
      # y hace que el binario lo busque ahí primero.
      - name: Runtime de CUDA como recurso (Linux)
        if: matrix.features == 'cuda' && startsWith(matrix.os, 'ubuntu')
        run: |
          mkdir -p src-tauri/cuda-libs
          cp -L /usr/local/cuda/lib64/libcudart.so.12 /usr/local/cuda/lib64/libcublas.so.12 /usr/local/cuda/lib64/libcublasLt.so.12 src-tauri/cuda-libs/
          ls -la src-tauri/cuda-libs
          echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,$ORIGIN/../lib/IureTranscribe:/usr/local/cuda/lib64' >> "$GITHUB_ENV"

      # --- CUDA (Windows): nvcc + cuBLAS; se compila con Ninja + MSVC para no
      # depender de la integración de CUDA con Visual Studio.
      - name: CUDA toolkit (Windows)
        if: matrix.features == 'cuda' && startsWith(matrix.os, 'windows')
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'
          use-github-cache: false
      - name: Runtime de CUDA como recurso (Windows)
        if: matrix.features == 'cuda' && startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          mkdir -p src-tauri/cuda-libs
          cp "$CUDA_PATH"/bin/cudart64_12.dll "$CUDA_PATH"/bin/cublas64_12.dll "$CUDA_PATH"/bin/cublasLt64_12.dll src-tauri/cuda-libs/
          ls -la src-tauri/cuda-libs
      # CUDA y Vulkan en Windows: Ninja + MSVC (el generador de Visual Studio falla
      # con la integración de CUDA y con el generador de shaders de Vulkan).
      - name: Entorno MSVC
        if: (matrix.features == 'cuda' || matrix.features == 'vulkan') && startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
      - name: Usar Ninja para whisper.cpp (Windows + GPU)
        if: (matrix.features == 'cuda' || matrix.features == 'vulkan') && startsWith(matrix.os, 'windows')
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      # El generador de shaders de Vulkan anida un proyecto CMake muy profundo y MSVC
      # falla con rutas largas (C1041): se compila en un directorio corto.
      - name: Directorio de compilación corto (Windows + Vulkan)
        if: matrix.features == 'vulkan' && startsWith(matrix.os, 'windows')
        shell: bash
        run: echo "CARGO_TARGET_DIR=D:/t" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Modelo Base incluido en el instalador
        shell: bash
        run: |
          mkdir -p src-tauri/resources/models
          curl -sSL --retry 3 -o src-tauri/resources/models/ggml-base.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          ls -la src-tauri/resources/models

      # Identificación de hablantes: ejecutable aparte (sidecar) porque onnxruntime
      # estático y whisper.cpp no conviven en el mismo binario. Tauri lo busca como
      # binaries/iuretranscribe-diarize-<triple> y lo instala junto a la app.
      - name: Sidecar de identificación de hablantes
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TARGET=$(echo "${{ matrix.args }}" | sed -n 's/.*--target \([^ ]*\).*/\1/p')
          TRIPLE=${TARGET:-$(rustc -vV | sed -n 's/^host: //p')}
          cargo build --release --target "$TRIPLE" --manifest-path src-tauri/diarizer/Cargo.toml --target-dir src-tauri/diarizer/target
          mkdir -p src-tauri/binaries
          cp "src-tauri/diarizer/target/$TRIPLE/release/iuretranscribe-diarize" "src-tauri/binaries/iuretranscribe-diarize-$TRIPLE"
          ls -la src-tauri/binaries
      # En Windows con PowerShell: tras msvc-dev-cmd, Git Bash antepone /usr/bin y
      # `link` sería el de coreutils en lugar del enlazador de MSVC.
      - name: Sidecar de identificación de hablantes (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $triple = ((rustc -vV) | Select-String '^host: ').ToString().Substring(6).Trim()
          cargo build --release --manifest-path src-tauri/diarizer/Cargo.toml --target-dir src-tauri/diarizer/target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item src-tauri/diarizer/target/release/iuretranscribe-diarize.exe "src-tauri/binaries/iuretranscribe-diarize-$triple.exe"
          Get-ChildItem src-tauri/binaries

      # --- Firma de Apple (Developer ID) -----------------------------------------------
      # El certificado va a un keychain temporal; Tauri firma el .app y el sidecar con
      # hardened runtime (APPLE_SIGNING_IDENTITY). En etiquetas, además, Tauri notariza y
      # engrapa el .app antes de armar el .dmg y el .app.tar.gz del actualizador
      # (APPLE_API_*). Secretos: los de iureapps (scripts/apple-secrets.sh con
      # REPO=ellaguno/iuretranscribe). Sin ellos sale sin firmar, como antes.
      - name: Firma de Apple (keychain temporal)
        id: apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEVELOPER_ID_P12_BASE64" ] || [ -z "$DEVELOPER_ID_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "::warning::Sin los secretos de Developer ID: el .app y el .dmg salen sin firmar."
            exit 0
          fi
          KC="$RUNNER_TEMP/iuretranscribe-firma.keychain-db"
          P12="$RUNNER_TEMP/devid.p12"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$P12" -k "$KC" -P "$DEVELOPER_ID_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$P12"
          # Intermedia de Developer ID (G2): sin ella la cadena puede no validar en el runner.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/g2.cer"
          security import "$RUNNER_TEMP/g2.cer" -k "$KC" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: .*(\('"$APPLE_TEAM_ID"'\))\)".*/\1/p' | head -n1)"
          if [ -z "$IDENTITY" ]; then
            security find-identity -v -p codesigning "$KC"
            echo "::error::El .p12 no trae una identidad «Developer ID Application» del equipo $APPLE_TEAM_ID."
            exit 1
          fi
          echo "Identidad: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "keychain=$KC" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_PRIVATE_KEY" ]; then
            KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"
            chmod 600 "$KEY"
            { echo "APPLE_API_KEY=$ASC_KEY_ID"; echo "APPLE_API_ISSUER=$ASC_ISSUER_ID"; echo "APPLE_API_KEY_PATH=$KEY"; } >> "$GITHUB_ENV"
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sólo se firma; la notarización va en las etiquetas."
          fi

      - name: Compilar y empaquetar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de los artefactos del actualizador (.sig). Sin estos secretos se
          # compila igual, pero la app sólo podrá avisar de versiones nuevas.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Sin optimizar para la CPU del runner: ggml compila por defecto con
          # -march=native (o su equivalente en MSVC), y los runners de GitHub tienen
          # AVX-512, así que el binario moría con «instrucción ilegal» al cargar el
          # modelo en cualquier CPU sin AVX-512: laptops, miniPCs y máquinas virtuales.
          # Con OFF, ggml usa AVX2/FMA/F16C, que tiene todo x86 desde 2013. En Apple
          # Silicon el runner y los usuarios comparten arquitectura y se deja nativo.
          GGML_NATIVE: ${{ matrix.name == 'macos-arm64' && 'ON' || 'OFF' }}
        with:
          projectPath: .
          args: ${{ matrix.args }} ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}

      # --- Firma Authenticode (Windows) con SignPath -------------------------------
      # Solo en releases (etiqueta) y solo cuando existen el token (secreto
      # SIGNPATH_API_TOKEN) y los identificadores del proyecto (variables
      # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG y SIGNPATH_SIGNING_POLICY_SLUG).
      # Sin ellos se publica sin firmar, como hasta ahora. SignPath recibe el
      # instalador de esta variante como artefacto, lo firma con el certificado de
      # SignPath Foundation tras la aprobación manual y lo devuelve; la firma
      # Authenticode cambia los bytes, así que la .sig del actualizador se rehace.
      - name: Instaladores de Windows por firmar
        id: sin_firmar
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          mkdir -p sin-firmar
          find "${CARGO_TARGET_DIR:-src-tauri/target}" -path '*/release/bundle/*' -type f \( -name '*-setup.exe' -o -name '*.msi' \) -exec cp {} sin-firmar/ \;
          ls -la sin-firmar
          echo "hay=$(ls sin-firmar | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Subir los instaladores como artefacto para SignPath
        id: artefacto_sin_firmar
        if: steps.sin_firmar.outputs.hay != '' && steps.sin_firmar.outputs.hay != '0'
        uses: actions/upload-artifact@v4
        with:
          name: sin-firmar-${{ matrix.name }}
          path: sin-firmar/*
          retention-days: 3

      - name: Firmar con SignPath
        id: signpath
        if: steps.artefacto_sin_firmar.outputs.artifact-id != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.artefacto_sin_firmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: firmados

      - name: Sustituir por los firmados y rehacer la firma del actualizador
        if: steps.signpath.outcome == 'success'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          base="${CARGO_TARGET_DIR:-src-tauri/target}"
          n=0
          for firmado in $(find firmados -type f \( -name '*.exe' -o -name '*.msi' \)); do
            nombre="$(basename "$firmado")"
            destino="$(find "$base" -path '*/release/bundle/*' -type f -name "$nombre" | head -1)"
            if [ -z "$destino" ]; then
              echo "::error::SignPath devolvió $nombre pero no existe en el bundle"
              exit 1
            fi
            cp "$firmado" "$destino"
            if [ -f "$destino.sig" ]; then
              npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$destino"
            fi
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo "::error::SignPath no devolvió ningún instalador"
            exit 1
          fi
          echo "$n instaladores firmados"

      # --- Paquete MSIX para Microsoft Store (sólo la variante Vulkan) -------------------
      # La Store no deja elegir variante: se publica la de Vulkan (sirve en GPU AMD, Intel y
      # NVIDIA y, si no hay GPU, cae al procesador). CUDA y CPU siguen sólo en la release.
      # Se arma con makeappx/makepri del SDK del runner con lo mismo que instala el NSIS
      # (ejecutable, sidecar de hablantes y modelo Base) más el cargador de Vulkan, para que
      # la app arranque también en equipos sin controladores de video con Vulkan. Salen dos
      # artefactos que no van a la release: `msix-store` (sin firmar, para Partner Center) y
      # `msix-prueba` (firmado con un certificado de prueba, con su .cer).
      - name: Paquete MSIX (Microsoft Store)
        if: matrix.name == 'windows-x64-vulkan'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:MSIX_IDENTITY_NAME -or -not $env:MSIX_PUBLISHER -or -not $env:MSIX_PUBLISHER_DISPLAY_NAME) {
            Write-Output "::warning::Faltan las variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER o MSIX_PUBLISHER_DISPLAY_NAME: el .msix lleva una identidad de prueba y Partner Center lo rechazará."
          }
          $identity = if ($env:MSIX_IDENTITY_NAME) { $env:MSIX_IDENTITY_NAME } else { 'Iurefficient.IureTranscribe' }
          $publisher = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { 'CN=Iurefficient' }
          $display = if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $env:MSIX_PUBLISHER_DISPLAY_NAME } else { 'Iurefficient' }
          # La Store no acepta un primer número 0 y exige el cuarto en 0: 0.8.5 → 1.8.5.0
          # (como Iurefficient Apps e IureProject). Siempre crece; la 1.0.0 será 2.0.0.0.
          $cargo = (Select-String -Path src-tauri\Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $parts = ($cargo -replace '-.*$', '').Split('.')
          $version = "$([int]$parts[0] + 1).$($parts[1]).$($parts[2]).0"
          Write-Output "Versión del paquete: $version"
          $identity = [System.Security.SecurityElement]::Escape($identity)
          $publisher = [System.Security.SecurityElement]::Escape($publisher)
          $display = [System.Security.SecurityElement]::Escape($display)

          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^10\.' -and (Test-Path "$($_.FullName)\x64\makeappx.exe") } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $tools = "$($sdk.FullName)\x64"
          Write-Output "Windows SDK: $tools"

          # Lo que instala el NSIS de esta variante (para comparar con el paquete).
          $target = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { 'src-tauri\target' }
          $nsis = Get-ChildItem "$target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          Write-Output "Contenido del instalador NSIS ($($nsis.Name)):"
          & 7z l $nsis.FullName | Select-String -NotMatch '\$PLUGINSDIR' | Out-String | Write-Output

          $root = 'msix\paquete'
          New-Item -ItemType Directory -Force $root, "$root\models", msix\store, msix\prueba | Out-Null
          Copy-Item -Recurse src-tauri\msix\Assets "$root\Assets"
          Copy-Item "$target\release\iuretranscribe.exe" "$root\IureTranscribe.exe"
          $triple = ((rustc -vV) | Select-String '^host: ').ToString().Substring(6).Trim()
          Copy-Item "src-tauri\binaries\iuretranscribe-diarize-$triple.exe" "$root\iuretranscribe-diarize.exe"
          Copy-Item src-tauri\resources\models\ggml-base.bin "$root\models\ggml-base.bin"
          # Cargador de Vulkan (vulkan-1.dll, Apache-2.0): lo instalan los controladores de
          # video; sin él el ejecutable ni siquiera abre. Con él, sin GPU la app usa el procesador.
          $deps = & dumpbin /dependents "$root\IureTranscribe.exe" | Out-String
          Write-Output $deps
          if ($deps -match 'vulkan-1\.dll') {
            $loader = @("$env:VULKAN_SDK\Bin\vulkan-1.dll", "$env:SystemRoot\System32\vulkan-1.dll") | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $loader) { Write-Output "::error::El ejecutable depende de vulkan-1.dll y no se encontró el cargador"; exit 1 }
            Write-Output "Cargador de Vulkan: $loader ($((Get-Item $loader).VersionInfo.FileVersion))"
            Copy-Item $loader "$root\vulkan-1.dll"
          }
          $manifest = Get-Content src-tauri\msix\AppxManifest.xml -Raw
          $manifest = $manifest.Replace('@IDENTITY_NAME@', $identity).Replace('@PUBLISHER@', $publisher)
          $manifest = $manifest.Replace('@PUBLISHER_DISPLAY_NAME@', $display).Replace('@VERSION@', $version)
          Set-Content "$root\AppxManifest.xml" $manifest -Encoding utf8
          Get-ChildItem -Recurse $root | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Output

          # resources.pri: idiomas (es-MX, en-US) e iconos sin fondo (altform-unplated) de la barra de tareas.
          & "$tools\makepri.exe" createconfig /cf msix\priconfig.xml /dq es-MX_en-US /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$tools\makepri.exe" new /pr $root /cf msix\priconfig.xml /mn "$root\AppxManifest.xml" /of "$root\resources.pri" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msix = 'iuretranscribe-windows-x64-vulkan.msix'
          & "$tools\makeappx.exe" pack /d $root /p "msix\store\$msix" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Copia de prueba: certificado autofirmado con el mismo Publisher.
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName 'IureTranscribe (prueba)' -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pass = ConvertTo-SecureString -String 'prueba' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath msix\prueba.pfx -Password $pass | Out-Null
          Export-Certificate -Cert $cert -FilePath msix\prueba\iuretranscribe-prueba.cer | Out-Null
          $prueba = 'msix\prueba\iuretranscribe-windows-x64-vulkan-prueba.msix'
          Copy-Item "msix\store\$msix" $prueba
          & "$tools\signtool.exe" sign /fd SHA256 /f msix\prueba.pfx /p prueba $prueba
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item msix\prueba.pfx

          # Prueba (el runner no tiene GPU): instalar la copia firmada; por el alias, que da
          # identidad de paquete, pedir la configuración MCP (debe apuntar al alias, no a la
          # carpeta versionada de WindowsApps) y hablar con el servidor MCP por stdio; abrir
          # la ventana y comprobar que crea la carpeta de modelos en el AppData del paquete;
          # desinstalar.
          Import-Certificate -FilePath msix\prueba\iuretranscribe-prueba.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path $prueba
          $pkg = Get-AppxPackage | Where-Object { $_.Name -eq $identity -or $_.Name -eq 'Iurefficient.IureTranscribe' } | Select-Object -First 1
          Write-Output "Instalado: $($pkg.PackageFullName)"
          $alias = "$env:LOCALAPPDATA\Microsoft\WindowsApps\iuretranscribe.exe"
          $fallos = @()
          try {
            $cfg = (& $alias --mcp-config 2>&1 | Out-String)
            Write-Output "iuretranscribe --mcp-config (alias):`n$cfg"
            if ($cfg -notmatch '--mcp' -or $cfg -notmatch 'WindowsApps\\\\iuretranscribe\.exe') { $fallos += 'la configuración MCP no apunta al alias de ejecución' }

            $psi = [System.Diagnostics.ProcessStartInfo]::new($alias, '--mcp')
            $psi.RedirectStandardInput = $true; $psi.RedirectStandardOutput = $true; $psi.RedirectStandardError = $true
            $psi.UseShellExecute = $false
            $p = [System.Diagnostics.Process]::Start($psi)
            $p.StandardInput.WriteLine('{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
            $p.StandardInput.WriteLine('{"jsonrpc":"2.0","method":"notifications/initialized"}')
            $p.StandardInput.WriteLine('{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
            $p.StandardInput.Close()
            $outTask = $p.StandardOutput.ReadToEndAsync(); $errTask = $p.StandardError.ReadToEndAsync()
            if (-not $p.WaitForExit(60000)) { $p.Kill(); $fallos += 'el servidor MCP no terminó en 60 s' }
            $mcp = $outTask.Result
            Write-Output "iuretranscribe --mcp (alias):`n$mcp"
            Write-Output "stderr: $($errTask.Result | Select-Object -Last 20)"
            if ($mcp -notmatch 'transcribe_file') { $fallos += 'el servidor MCP no listó sus herramientas' }

            Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!IureTranscribe"
            Start-Sleep -Seconds 20
            $gui = Get-Process -Name IureTranscribe -ErrorAction SilentlyContinue
            if ($gui) { Write-Output "La ventana sigue abierta tras 20 s (PID $($gui.Id -join ', '))" } else { $fallos += 'la app se cerró sola al abrir la ventana' }
            $modelos = Get-ChildItem "$env:LOCALAPPDATA\Packages\$($pkg.PackageFamilyName)\LocalCache\Roaming" -Recurse -Directory -Filter models -ErrorAction SilentlyContinue
            if ($modelos) { Write-Output "Carpeta de modelos (AppData virtualizado): $($modelos.FullName -join ', ')" } else { $fallos += 'no apareció la carpeta de modelos en el AppData del paquete' }
            $gui | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          } finally {
            Get-Process -Name IureTranscribe, iuretranscribe-diarize -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-AppxPackage -Package $pkg.PackageFullName
            Write-Output "Desinstalado: $($pkg.PackageFullName)"
          }
          if ($fallos) { $fallos | ForEach-Object { Write-Output "::error::MSIX: $_" }; exit 1 }
          Get-ChildItem msix\store, msix\prueba | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Output
      - name: Subir el MSIX para la Store
        if: matrix.name == 'windows-x64-vulkan'
        uses: actions/upload-artifact@v4
        with:
          name: msix-store
          path: msix/store/*
      - name: Subir el MSIX de prueba
        if: matrix.name == 'windows-x64-vulkan'
        uses: actions/upload-artifact@v4
        with:
          name: msix-prueba
          path: msix/prueba/*

      # El .app ya viene notarizado y engrapado por Tauri; se notariza también el .dmg
      # (para que Gatekeeper lo acepte al abrirlo sin conexión) y se comprueba todo como
      # lo haría un Mac. El .app.tar.gz del actualizador no cambia, así que su .sig vale.
      - name: Notarizar el .dmg y comprobar Gatekeeper
        if: steps.apple.outputs.notarize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$(find "${CARGO_TARGET_DIR:-src-tauri/target}" -type d -path '*/release/bundle' | head -1)"
          APP="$BUNDLE/macos/IureTranscribe.app"
          DMG="$(find "$BUNDLE/dmg" -name '*.dmg' | head -1)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority=Developer ID Application|flags=.*runtime'
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          codesign --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG" 2>/dev/null || true
          NOTARY=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          OUT="$(xcrun notarytool submit "$DMG" "${NOTARY[@]}" --wait --timeout 150m --output-format json || true)"
          echo "$OUT"
          field() { printf '%s' "$OUT" | python3 -c 'import json,sys
          try: print(json.load(sys.stdin).get(sys.argv[1], ""))
          except Exception: print("")' "$1"; }
          STATUS="$(field status)"; ID="$(field id)"
          if [ "$STATUS" != Accepted ]; then
            if [ -n "$ID" ]; then xcrun notarytool log "$ID" "${NOTARY[@]}" || true; fi
            echo "::error::La notarización de $DMG no quedó aceptada (estado «${STATUS:-sin respuesta}», id ${ID:-ninguno})."
            exit 1
          fi
          xcrun stapler staple -v "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"

      - name: Borrar el keychain temporal
        if: always() && steps.apple.outputs.keychain != ''
        shell: bash
        run: security delete-keychain "${{ steps.apple.outputs.keychain }}" || true

      # Renombra los instaladores con la variante para que no choquen entre sí en la
      # release. GitHub lista los assets por nombre (orden ASCII), así que el prefijo
      # numérico deja primero Windows, luego macOS y al final Linux.
      - name: Renombrar instaladores
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "${{ matrix.name }}" in
            windows-*) ORDEN=1 ;;
            macos-*)   ORDEN=2 ;;
            *)         ORDEN=3 ;;
          esac
          mkdir -p dist-release
          # bash 3.2 de macOS no tiene globstar: se usa find.
          find "${CARGO_TARGET_DIR:-src-tauri/target}" -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \
               -o -name '*.AppImage.sig' -o -name '*-setup.exe.sig' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) \
            -print | while read -r f; do
            base="$(basename "$f")"
            case "$base" in
              *.app.tar.gz.sig) ext="app.tar.gz.sig" ;;
              *.app.tar.gz)     ext="app.tar.gz" ;;
              *.AppImage.sig)   ext="AppImage.sig" ;;
              *-setup.exe.sig)  ext="exe.sig" ;;
              *)                ext="${base##*.}" ;;
            esac
            cp "$f" "dist-release/IureTranscribe_${VERSION}_${ORDEN}-${{ matrix.name }}.${ext}"
          done
          ls -la dist-release

      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "IureTranscribe $TAG" --notes-file .github/release-notes.md || true
          gh release upload "$TAG" dist-release/* --clobber

      - name: Publicar artefactos de compilación
        uses: actions/upload-artifact@v4
        with:
          name: iuretranscribe-${{ matrix.name }}
          if-no-files-found: ignore
          path: dist-release/*

  # Manifiesto del actualizador: una entrada por plataforma y variante, con las
  # firmas generadas por cada trabajo. Las instalaciones .deb/.rpm no se
  # actualizan solas (la app avisa y enlaza la release).
  manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generar latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, glob, datetime, re
          tag = os.environ["GITHUB_REF_NAME"]; version = tag.lstrip("v")
          base = f"https://github.com/ellaguno/iuretranscribe/releases/download/{tag}/"
          # nombre de variante en los archivos → clave del actualizador (os-arch[-variante])
          targets = {
            "linux-x64": "linux-x86_64", "linux-x64-vulkan": "linux-x86_64-vulkan", "linux-x64-cuda": "linux-x86_64-cuda",
            "windows-x64": "windows-x86_64", "windows-x64-vulkan": "windows-x86_64-vulkan", "windows-x64-cuda": "windows-x86_64-cuda",
            "macos-arm64": "darwin-aarch64", "macos-x64": "darwin-x86_64",
          }
          platforms = {}
          for sig in glob.glob("artifacts/**/*.sig", recursive=True):
              name = os.path.basename(sig)
              asset = name[:-4]  # sin .sig
              variant = None
              for v in targets:
                  # IureTranscribe_<versión>_<orden>-<variante>.<ext>
                  if re.match(rf"IureTranscribe_{re.escape(version)}_\d-{re.escape(v)}\.", asset):
                      variant = v
              if not variant:
                  continue
              platforms[targets[variant]] = {"url": base + asset, "signature": open(sig).read().strip()}
          manifest = {"version": version, "notes": f"IureTranscribe {version}", "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "platforms": platforms}
          json.dump(manifest, open("latest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
