name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            features: ""
            args: ""
          - name: linux-x64-cuda
            os: ubuntu-22.04
            features: "cuda"
            args: ""
          - name: windows-x64
            os: windows-latest
            features: ""
            args: ""
          - name: windows-x64-cuda
            os: windows-latest
            features: "cuda"
            args: ""
          - name: macos-arm64
            os: macos-latest
            features: "metal"
            args: "--target aarch64-apple-darwin"
          - name: macos-x64
            os: macos-13
            features: ""
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: Dependencias de Linux (Tauri)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential cmake libclang-dev libssl-dev

      - name: CUDA toolkit
        if: matrix.features == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas-dev"]'
          non-cuda-sub-packages: '[]'

      - run: npm ci

      - name: Compilar y empaquetar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_FEATURES: ${{ matrix.features }}
        with:
          projectPath: .
          args: ${{ matrix.args }} ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('IureTranscribe {0}', github.ref_name) || '' }}
          releaseBody: "Instaladores generados automáticamente. Las variantes *cuda* requieren una GPU NVIDIA con drivers recientes."
          releaseDraft: true
          prerelease: false

      - name: Publicar artefactos de compilación
        uses: actions/upload-artifact@v4
        with:
          name: iuretranscribe-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
