name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Un push nuevo cancela la corrida anterior de la misma rama (las etiquetas nunca se cancelan).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CUDA_VERSION: "12.8.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            features: ""
            args: ""
          - name: linux-x64-cuda
            os: ubuntu-22.04
            features: "cuda"
            # Sin AppImage: linuxdeploy no puede resolver las librerías de CUDA.
            args: "--bundles deb rpm --config src-tauri/tauri.cuda-linux.conf.json"
          - name: windows-x64
            os: windows-latest
            features: ""
            args: ""
          - name: windows-x64-cuda
            os: windows-2022
            features: "cuda"
            # Sólo NSIS: el .msi duplicaría los ~500 MB del runtime de CUDA.
            args: "--bundles nsis --config src-tauri/tauri.cuda-windows.conf.json"
          - name: macos-arm64
            os: macos-latest
            features: "metal"
            args: "--target aarch64-apple-darwin"
          - name: macos-x64
            os: macos-15-intel
            features: ""
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: Dependencias de Linux (Tauri)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential cmake libclang-dev libssl-dev

      # --- CUDA (Linux): sólo los paquetes necesarios del repositorio de NVIDIA.
      - name: CUDA toolkit (Linux)
        if: matrix.features == 'cuda' && startsWith(matrix.os, 'ubuntu')
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart-dev", "driver-dev"]'
          non-cuda-sub-packages: '["libcublas-dev"]'
          use-github-cache: false

      # Copia el runtime de CUDA para incluirlo en el .deb/.rpm (/usr/lib/iuretranscribe)
      # y hace que el binario lo busque ahí primero.
      - name: Runtime de CUDA como recurso (Linux)
        if: matrix.features == 'cuda' && startsWith(matrix.os, 'ubuntu')
        run: |
          mkdir -p src-tauri/cuda-libs
          cp -L /usr/local/cuda/lib64/libcudart.so.12 /usr/local/cuda/lib64/libcublas.so.12 /usr/local/cuda/lib64/libcublasLt.so.12 src-tauri/cuda-libs/
          ls -la src-tauri/cuda-libs
          echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,$ORIGIN/../lib/iuretranscribe:/usr/local/cuda/lib64' >> "$GITHUB_ENV"

      # --- CUDA (Windows): nvcc + cuBLAS; se compila con Ninja + MSVC para no
      # depender de la integración de CUDA con Visual Studio.
      - name: CUDA toolkit (Windows)
        if: matrix.features == 'cuda' && startsWith(matrix.os, 'windows')
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'
          use-github-cache: false
      - name: Runtime de CUDA como recurso (Windows)
        if: matrix.features == 'cuda' && startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          mkdir -p src-tauri/cuda-libs
          cp "$CUDA_PATH"/bin/cudart64_12.dll "$CUDA_PATH"/bin/cublas64_12.dll "$CUDA_PATH"/bin/cublasLt64_12.dll src-tauri/cuda-libs/
          ls -la src-tauri/cuda-libs
      - name: Entorno MSVC
        if: matrix.features == 'cuda' && startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
      - name: Usar Ninja para whisper.cpp (Windows + CUDA)
        if: matrix.features == 'cuda' && startsWith(matrix.os, 'windows')
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Compilar y empaquetar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }} ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('IureTranscribe {0}', github.ref_name) || '' }}
          releaseBody: "Instaladores generados automáticamente. Las variantes *cuda* incluyen el runtime de CUDA 12 y sólo requieren una GPU NVIDIA con driver reciente (≥ 525). Las demás funcionan en cualquier equipo: CPU, o Metal en Mac con Apple Silicon."
          releaseDraft: true
          prerelease: false

      - name: Publicar artefactos de compilación
        uses: actions/upload-artifact@v4
        with:
          name: iuretranscribe-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
