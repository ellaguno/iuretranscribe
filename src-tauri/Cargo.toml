[package]
name = "iuretranscribe"
version = "0.6.0"
description = "Transcripción de audio y video con Whisper, con resumen y minuta"
authors = ["Iurefficient"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "iuretranscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = { version = "0.16", features = ["log_backend"] }
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "wav", "flac", "ogg", "vorbis", "pcm", "alac", "mkv"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }
futures-util = "0.3"
bytes = "1"
anyhow = "1"
thiserror = "2"
dirs = "6"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

hound = "3.5"
iurefficient-connect = { git = "https://github.com/ellaguno/iurefficient-connect", tag = "v0.6.0" }

# Captura de audio con cpal en Windows/macOS; en Linux se usa PipeWire/PulseAudio por subproceso.
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18"

[features]
default = []
cuda = ["whisper-rs/cuda"]
metal = ["whisper-rs/metal"]
coreml = ["whisper-rs/coreml"]
vulkan = ["whisper-rs/vulkan"]
openblas = ["whisper-rs/openblas"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dependencias optimizadas también en desarrollo (whisper.cpp en debug es inusable).
[profile.dev.package."*"]
opt-level = 3
